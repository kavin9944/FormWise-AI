<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – FormWise AI</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background-color: rgba(15, 23, 42, 0.05);
    }

    /* From Uiverse.io by Yaya12085 */ 
    .form-container,
    .auth-card {
      width: 340px;
      max-width: 100%;
      box-sizing: border-box;
      border-radius: 0.75rem;
      background-color: rgba(17, 24, 39, 1);
      padding: 2rem;
      color: rgba(243, 244, 246, 1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    .title,
    .auth-header h2 {
      text-align: center;
      font-size: 1.5rem;
      line-height: 2rem;
      font-weight: 700;
      color: rgba(243, 244, 246, 1);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .auth-header .logo {
      justify-content: center;
      margin-bottom: 16px;
      text-decoration: none;
    }

    .auth-header .logo-text {
      color: #FFFFFF;
    }

    .auth-header .logo-text span {
      color: rgba(167, 139, 250, 1);
    }

    .auth-header p {
      font-size: 0.875rem;
      color: rgba(156, 163, 175, 1);
      margin-top: 6px;
    }

    .form,
    #registerForm {
      margin-top: 1.5rem;
    }

    .input-group,
    .form-group {
      margin-top: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label,
    .form-group label {
      display: block;
      color: rgba(156, 163, 175, 1);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .input-group input,
    .form-control {
      width: 100%;
      box-sizing: border-box;
      border-radius: 0.375rem;
      border: 1px solid rgba(55, 65, 81, 1);
      outline: 0;
      background-color: rgba(17, 24, 39, 1);
      padding: 0.75rem 1rem;
      color: rgba(243, 244, 246, 1);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .input-group input:focus,
    .form-control:focus {
      border-color: rgba(167, 139, 250, 1);
      outline: 0;
      box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.25);
    }

    .error-banner {
      display: none;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #FCA5A5;
      padding: 10px 14px;
      border-radius: 0.375rem;
      font-size: 0.85rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .forgot {
      display: flex;
      justify-content: flex-end;
      font-size: 0.75rem;
      line-height: 1rem;
      color: rgba(156, 163, 175, 1);
      margin: 8px 0 14px 0;
    }

    .forgot a,
    .signup a,
    .auth-footer a {
      color: rgba(243, 244, 246, 1);
      text-decoration: none;
      font-size: 14px;
    }

    .forgot a:hover,
    .signup a:hover,
    .auth-footer a:hover {
      text-decoration: underline rgba(167, 139, 250, 1);
    }

    .sign,
    .auth-card #registerBtn,
    .auth-card .btn-primary {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background-color: rgba(167, 139, 250, 1) !important;
      padding: 0.75rem;
      text-align: center;
      color: rgba(17, 24, 39, 1) !important;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: none;
      transition: background-color 0.2s;
    }

    .sign:hover,
    .auth-card #registerBtn:hover,
    .auth-card .btn-primary:hover {
      background-color: rgba(196, 181, 253, 1) !important;
      transform: none;
    }

    .social-message {
      display: flex;
      align-items: center;
      padding-top: 1rem;
    }

    .line {
      height: 1px;
      flex: 1 1 0%;
      background-color: rgba(55, 65, 81, 1);
    }

    .social-message .message {
      padding-left: 0.75rem;
      padding-right: 0.75rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      color: rgba(156, 163, 175, 1);
    }

    .social-icons {
      display: flex;
      justify-content: center;
    }

    .social-icons .icon {
      border-radius: 0.125rem;
      padding: 0.75rem;
      border: none;
      background-color: transparent;
      margin-left: 8px;
      cursor: pointer;
    }

    .social-icons .icon svg {
      height: 1.25rem;
      width: 1.25rem;
      fill: #fff;
    }

    .signup,
    .auth-footer {
      text-align: center;
      font-size: 0.75rem;
      line-height: 1rem;
      color: rgba(156, 163, 175, 1);
      margin-top: 1.25rem;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 0.9rem;
      color: rgba(156, 163, 175, 1);
      font-weight: 500;
      text-decoration: none;
    }

    .back-home:hover {
      color: rgba(167, 139, 250, 1);
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo">
          <div class="logo-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <path d="M9 15h6"></path>
              <path d="M9 11h3"></path>
              <path d="M9 19h6"></path>
            </svg>
          </div>
          <span class="logo-text">FormWise<span>AI</span></span>
        </a>
        <h2>Create an Account</h2>
        <p>Get started with smart AI-assisted form filling</p>
      </div>

      <!-- Alert Notification Banner -->
      <div id="errorBanner" class="error-banner" role="alert"></div>

      <form id="registerForm">
        <!-- Full Name -->
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Ananya Sundaram" required>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="student@example.com" required>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" minlength="6" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="registerBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
          Create Account
        </button>
      </form>

      <!-- Switch to Login -->
      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>

    <!-- Return Link -->
    <a href="index.html" class="back-home">
      ← Back to Home
    </a>
  </div>

  <!-- Registration Module Script -->
  <script type="module">
    import { registerUser } from "./js/auth.js";

    const registerForm = document.getElementById("registerForm");
    const errorBanner = document.getElementById("errorBanner");
    const registerBtn = document.getElementById("registerBtn");

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.style.display = "block";
    }

    function clearError() {
      errorBanner.textContent = "";
      errorBanner.style.display = "none";
    }

    if (registerForm) {
      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearError();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        // 1. Validation: Ensure all fields are filled
        if (!name || !email || !password || !confirmPassword) {
          showError("Please fill in all required fields.");
          return;
        }

        // 2. Validation: Ensure passwords match
        if (password !== confirmPassword) {
          showError("Passwords do not match. Please re-check.");
          return;
        }

        // 3. Validation: Minimum password length (Firebase requires >= 6 chars)
        if (password.length < 6) {
          showError("Password must be at least 6 characters long.");
          return;
        }

        // Set loading state on button
        registerBtn.disabled = true;
        registerBtn.textContent = "Creating Account...";

        try {
          const result = await registerUser(name, email, password);

          if (result.success) {
            alert("Account created successfully! Redirecting to your dashboard...");
            window.location.href = "dashboard.html";
          } else {
            showError("Registration failed: " + result.message);
          }
        } catch (err) {
          showError("An unexpected error occurred: " + err.message);
        } finally {
          registerBtn.disabled = false;
          registerBtn.textContent = "Create Account";
        }
      });
    }
  </script>
</body>
</html>
