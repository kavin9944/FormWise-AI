<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – FormWise AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background-color: rgba(15, 23, 42, 0.05);
    }

    /* From Uiverse.io by Yaya12085 */ 
    .form-container,
    .auth-card {
      width: 320px;
      max-width: 100%;
      box-sizing: border-box;
      border-radius: 0.75rem;
      background-color: rgba(17, 24, 39, 1);
      padding: 2rem;
      color: rgba(243, 244, 246, 1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    .title,
    .auth-header h2 {
      text-align: center;
      font-size: 1.5rem;
      line-height: 2rem;
      font-weight: 700;
      color: rgba(243, 244, 246, 1);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .auth-header .logo {
      justify-content: center;
      margin-bottom: 16px;
      text-decoration: none;
    }

    .auth-header .logo-text {
      color: #FFFFFF;
    }

    .auth-header .logo-text span {
      color: rgba(167, 139, 250, 1);
    }

    .auth-header p {
      font-size: 0.875rem;
      color: rgba(156, 163, 175, 1);
      margin-top: 6px;
    }

    .form,
    #loginForm {
      margin-top: 1.5rem;
    }

    .input-group,
    .form-group {
      margin-top: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label,
    .form-group label {
      display: block;
      color: rgba(156, 163, 175, 1);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .input-group input,
    .form-control {
      width: 100%;
      box-sizing: border-box;
      border-radius: 0.375rem;
      border: 1px solid rgba(55, 65, 81, 1);
      outline: 0;
      background-color: rgba(17, 24, 39, 1);
      padding: 0.75rem 1rem;
      color: rgba(243, 244, 246, 1);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .input-group input:focus,
    .form-control:focus {
      border-color: rgba(167, 139, 250, 1);
      outline: 0;
      box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.25);
    }

    .forgot {
      display: flex;
      justify-content: flex-end;
      font-size: 0.75rem;
      line-height: 1rem;
      color: rgba(156, 163, 175, 1);
      margin: 8px 0 14px 0;
    }

    .forgot a,
    .signup a,
    .auth-footer a {
      color: rgba(243, 244, 246, 1);
      text-decoration: none;
      font-size: 14px;
    }

    .forgot a:hover,
    .signup a:hover,
    .auth-footer a:hover {
      text-decoration: underline rgba(167, 139, 250, 1);
    }

    .sign,
    .auth-card #loginBtn,
    .auth-card .btn-primary {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background-color: rgba(167, 139, 250, 1) !important;
      padding: 0.75rem;
      text-align: center;
      color: rgba(17, 24, 39, 1) !important;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: none;
      transition: background-color 0.2s;
    }

    .sign:hover,
    .auth-card #loginBtn:hover,
    .auth-card .btn-primary:hover {
      background-color: rgba(196, 181, 253, 1) !important;
      transform: none;
    }

    .social-message {
      display: flex;
      align-items: center;
      padding-top: 1rem;
    }

    .line {
      height: 1px;
      flex: 1 1 0%;
      background-color: rgba(55, 65, 81, 1);
    }

    .social-message .message {
      padding-left: 0.75rem;
      padding-right: 0.75rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      color: rgba(156, 163, 175, 1);
    }

    .social-icons {
      display: flex;
      justify-content: center;
    }

    .social-icons .icon {
      border-radius: 0.125rem;
      padding: 0.75rem;
      border: none;
      background-color: transparent;
      margin-left: 8px;
      cursor: pointer;
    }

    .social-icons .icon svg {
      height: 1.25rem;
      width: 1.25rem;
      fill: #fff;
    }

    .signup,
    .auth-footer {
      text-align: center;
      font-size: 0.75rem;
      line-height: 1rem;
      color: rgba(156, 163, 175, 1);
      margin-top: 1.25rem;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 0.9rem;
      color: rgba(156, 163, 175, 1);
      font-weight: 500;
      text-decoration: none;
    }

    .back-home:hover {
      color: rgba(167, 139, 250, 1);
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo">
          <div class="logo-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <path d="M9 15h6"></path>
              <path d="M9 11h3"></path>
              <path d="M9 19h6"></path>
            </svg>
          </div>
          <span class="logo-text">FormWise<span>AI</span></span>
        </a>
        <h2>Welcome to FormWise AI</h2>
        <p>Sign in to access your smart form assistant</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
          Login
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>

    <a href="index.html" class="back-home">
      ← Back to Home
    </a>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
