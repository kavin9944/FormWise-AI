# Netlify Configuration for FormWise AI
[build]
  publish = "frontend"

# Cache control for static CSS and JavaScript assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Optional Netlify API Proxy (synchronous with _redirects)
[[redirects]]
  from = "/api/*"
  to = "https://formwise-ai.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://formwise-ai.onrender.com/health"
  status = 200
  force = true
